<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideNow - Book Your Ride</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        .btn-secondary {
            background-color: #2c3e50;
            color: white;
        }
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #3498db;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        .vehicle-option {
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .vehicle-option:hover {
            border-color: #3498db;
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.2);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .status-step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ccc;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            position: relative;
        }
        .status-step.active {
            background-color: #2ecc71;
        }
        .status-step.completed {
            background-color: #3498db;
        }
        .status-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 100%;
            width: 20px;
            height: 2px;
            background-color: #ccc;
        }
        .status-step.completed:not(:last-child)::after {
            background-color: #3498db;
        }
    </style>
</head>
<body>

<div class="bg-white shadow-md rounded-xl p-8 max-w-lg w-full mx-auto my-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Book a Ride</h2>
    <div class="mb-4">
        <label for="pickup" class="block text-gray-700 font-semibold mb-2">Pickup Location</label>
        <input type="text" id="pickup" placeholder="Enter pickup location" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
        <label for="dropoff" class="block text-gray-700 font-semibold mb-2">Drop-off Location</label>
        <input type="text" id="dropoff" placeholder="Enter drop-off location" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
    </div>
    <button onclick="confirmLocations()" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors">
        Confirm Locations
    </button>
    <div id="vehicle-options" class="mt-6 hidden">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Select Vehicle</h3>
        <div class="space-y-4">
            <div class="vehicle-option p-4 border rounded-md cursor-pointer hover:bg-gray-50 flex justify-between items-center" onclick="selectVehicle('bike', this)">
                <div class="flex items-center">
                    <img src="https://img.icons8.com/color/48/motorcycle.png" alt="Bike" class="w-8 h-8 mr-4">
                    <span>Bike</span>
                </div>
                <div>
                    <span id="bike-fare" class="font-semibold text-lg"></span> |
                    <span id="bike-time" class="text-sm text-gray-500"></span> mins
                </div>
            </div>
            <div class="vehicle-option p-4 border rounded-md cursor-pointer hover:bg-gray-50 flex justify-between items-center" onclick="selectVehicle('auto', this)">
                <div class="flex items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Auto_Rickshaw_Election_Symbol.svg" alt="Auto" class="w-8 h-8 mr-4">
                    <span>Auto</span>
                </div>
                <div>
                    <span id="auto-fare" class="font-semibold text-lg"></span> |
                    <span id="auto-time" class="text-sm text-gray-500"></span> mins
                </div>
            </div>
            <div class="vehicle-option p-4 border rounded-md cursor-pointer hover:bg-gray-50 flex justify-between items-center" onclick="selectVehicle('cab', this)">
                <div class="flex items-center">
                    <img src="https://img.icons8.com/emoji/48/oncoming-automobile.png" alt="Cab" class="w-8 h-8 mr-4">
                    <span>Cab</span>
                </div>
                <div>
                    <span id="cab-fare" class="font-semibold text-lg"></span> |
                    <span id="cab-time" class="text-sm text-gray-500"></span> mins
                </div>
            </div>
        </div>
        <button onclick="bookRide()" class="w-full bg-green-500 text-white py-2 rounded-md mt-6 hover:bg-green-600 transition-colors">
            Book Ride
        </button>
    </div>
</div>

<div id="messageBox" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-md shadow-lg hidden"></div>

<div id="bookingModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-lg w-96 text-center">
        <h3 class="text-xl font-bold mb-4" id="modal-title">Searching for driver...</h3>
        <p id="modal-message">We are looking for a driver near you. This may take a moment.</p>
        <button onclick="cancelBooking()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Cancel</button>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:5002/api';
    const GOOGLE_MAPS_API_KEY = "AIzaSyDqW6tsp_sUG5-Xf6aXFzYuqrvRiGehGXg";
    let ws = null;
    let currentBookingId = null;
    let selectedVehicleType = null;

    document.addEventListener('DOMContentLoaded', () => {
        connectWebSocket();
    });

    function connectWebSocket() {
        ws = new WebSocket('ws://localhost:5002');
        ws.onopen = () => console.log('WebSocket connected');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'ride_accepted') {
                document.getElementById('modal-title').textContent = 'Driver Found!';
                document.getElementById('modal-message').innerHTML = `Your ride has been accepted by a driver. <br>OTP: <strong>${data.otp}</strong>`;
            } else if (data.type === 'ride_cancelled') {
                 showMessage('Ride cancelled by driver.', 'error');
                 document.getElementById('bookingModal').style.display = 'none';
                 currentBookingId = null;
            }
        };
        ws.onclose = () => {
            console.log('WebSocket disconnected. Reconnecting...');
            setTimeout(() => connectWebSocket(), 5000);
        };
        ws.onerror = (error) => console.error('WebSocket error:', error);
    }
    
    function showMessage(message, type = 'info') {
        const messageBox = document.getElementById('messageBox');
        messageBox.textContent = message;
        messageBox.style.display = 'block';
        setTimeout(() => messageBox.style.display = 'none', 3000);
    }

    function selectVehicle(vehicleType, element) {
        document.querySelectorAll('.vehicle-option').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-100'));
        element.classList.add('border-blue-500', 'bg-blue-100');
        selectedVehicleType = vehicleType;
    }

    async function confirmLocations() {
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        if (!pickup || !dropoff) {
            showMessage("Please enter both locations.");
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/calculate-route`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pickup, dropoff, key: GOOGLE_MAPS_API_KEY })
            });
            const data = await response.json();
            if (response.ok) {
                document.getElementById('bike-fare').textContent = `₹${(data.distance * 12).toFixed(2)}`;
                document.getElementById('auto-fare').textContent = `₹${(data.distance * 15).toFixed(2)}`;
                document.getElementById('cab-fare').textContent = `₹${(data.distance * 18).toFixed(2)}`;
                document.getElementById('bike-time').textContent = data.duration;
                document.getElementById('auto-time').textContent = data.duration;
                document.getElementById('cab-time').textContent = data.duration;
                document.getElementById('vehicle-options').classList.remove('hidden');
            } else {
                showMessage(data.message || 'Failed to calculate route.', 'error');
            }
        } catch (error) {
            showMessage('Network error. Please try again.', 'error');
        }
    }

    async function bookRide() {
        const pickup = document.getElementById('pickup').value;
        const dropoff = document.getElementById('dropoff').value;
        if (!selectedVehicleType || !pickup || !dropoff) {
            showMessage("Please select a vehicle and enter both locations.");
            return;
        }

        currentBookingId = 'BK' + Math.random().toString(36).substr(2, 8).toUpperCase();
        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        const distance = parseFloat(document.getElementById(`${selectedVehicleType}-fare`).textContent.replace('₹', '')) / 18;
        const estimatedTime = document.getElementById(`${selectedVehicleType}-time`).textContent;

        document.getElementById('bookingModal').style.display = 'flex';
        
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'register_rider',
                bookingId: currentBookingId
            }));
        }

        try {
            const response = await fetch(`${API_BASE_URL}/book-ride`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pickup,
                    dropoff,
                    vehicleType: selectedVehicleType,
                    bookingId: currentBookingId,
                    otp,
                    distance,
                    estimatedTime,
                    riderLocation: { lat: 17.3850, lng: 78.4867 } // Static for demo, replace with real location
                })
            });
            const data = await response.json();
            if (!response.ok) {
                showMessage(data.message || 'Booking failed.', 'error');
                document.getElementById('bookingModal').style.display = 'none';
            }
        } catch (error) {
            showMessage('Failed to book ride. Please check network.', 'error');
            document.getElementById('bookingModal').style.display = 'none';
        }
    }

    async function cancelBooking() {
        if (!currentBookingId) return;
        try {
            const response = await fetch(`${API_BASE_URL}/cancel-booking`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bookingId: currentBookingId })
            });
            if (response.ok) {
                showMessage('Ride cancelled successfully.');
                document.getElementById('bookingModal').style.display = 'none';
                currentBookingId = null;
            } else {
                const data = await response.json();
                showMessage(data.message || 'Failed to cancel ride.', 'error');
            }
        } catch (error) {
            showMessage('Failed to cancel ride. Network error.', 'error');
        }
    }
</script>
</body>
</html>
